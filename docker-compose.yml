services:
  pluma:
    build: .
    ports:
      - "127.0.0.1:8000:8000" # Editor
      - "127.0.0.1:8001:8001" # Site preview
      - "127.0.0.1:5173:5173" # Vite dev server
    volumes:
      # Use the development environment's code (including vendor/, .env and
      # public/build) so changes are reflected while developing.
      - .:/pluma
    environment:
      VIEW_COMPILED_PATH: /tmp/pluma/views
    # Match the host user so files written to the mounted repo
    # (storage/logs) are not owned by root.
    user: "1000:1000"
    # Laravel Boost's MCP server attaches here with `docker compose exec`
    # (see .mcp.json), so every editor session reuses this container instead of
    # starting one of its own. It must be up for the MCP server to connect.
    tty: true

  composer:
    build:
      context: .
      target: composer-cli
    volumes:
      - .:/pluma
      # Keep Composer's cache between runs.
      - composer-cache:/tmp/composer
      # Keep Pest's test impact analysis graph between runs, so `make test` only
      # re-runs the tests affected by the changes since the last run.
      - pest-cache:/tmp/pest
    # Match the host user so vendor/ is not owned by root.
    user: "1000:1000"
    # Only started explicitly with `docker compose run`, never by `up`.
    profiles:
      - tools

  node:
    build:
      context: .
      target: node-cli
    volumes:
      - .:/pluma
      # Keep npm's cache between runs.
      - npm-cache:/tmp/npm
    # Match the host user so node_modules/ is not owned by root.
    user: "1000:1000"
    # Only started explicitly with `docker compose run`, never by `up`, for
    # one-off commands: `docker compose run --rm node install`. The entrypoint
    # is npm. The Vite dev server runs in the vite service instead.
    profiles:
      - tools

  vite:
    build:
      context: .
      target: node-cli
    network_mode: service:pluma
    volumes:
      - .:/pluma
      - npm-cache:/tmp/npm
    environment:
      # The host the browser uses to reach the dev server, written to public/hot.
      VITE_DEV_SERVER_HOST: 127.0.0.1
    user: "1000:1000"
    # Started by `up` so assets are rebuilt while developing. `--host` makes
    # Vite listen on every interface, so the published port reaches it from
    # the host.
    command: ["run", "dev", "--", "--host"]

  browser:
    build:
      context: .
      target: browser
    network_mode: service:pluma
    init: true
    user: "1000:1000"
    volumes:
      - .:/pluma
    working_dir: /pluma
    shm_size: 1gb

volumes:
  composer-cache:
  npm-cache:
  pest-cache:
